<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENES DEVA | VIP PROTOKOL</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Matrix Canvas */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.3;
        }

        /* VIP Giriş Katmanı */
        #vip-layer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
        }

        /* 100 Çizgi Animasyonu */
        .line-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0f0, transparent);
            width: 150px;
            left: -200px;
            opacity: 0.8;
            box-shadow: 0 0 10px #0f0;
        }

        /* Hoşgeldin Yazısı */
        #welcome-text {
            display: none;
            color: #0f0;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 20px #0f0, 0 0 30px #0f0;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-align: center;
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(2deg); }
            40% { transform: skew(-2deg); }
            100% { transform: skew(0deg); }
        }

        /* Şifre Paneli */
        .login-box {
            background: rgba(0, 20, 0, 0.9);
            border: 1px solid #0f0;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.2);
            text-align: center;
        }

        input {
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            width: 280px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 20px #0f0;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="line-container" id="lineBox"></div>

    <div id="vip-layer">
        <div id="loginSection" class="login-box">
            <h2 style="color: #0f0;">VIP ACCESS REQUIRED</h2>
            <input type="password" id="passCode" placeholder="PROTOKOL ŞİFRESİ">
            <br>
            <button onclick="checkAccess()">ERİŞİM SAĞLA</button>
        </div>
        <h1 id="welcome-text">HOŞGELDİNİZ ENES DEVA</h1>
    </div>

    <script>
        // Matrix Efekti
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px arial';
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Şifre Kontrolü ve VIP Animasyon Başlangıcı
        function checkAccess() {
            const pass = document.getElementById('passCode').value;
            if (pass === "ED.DEVA.VİP.PROTOKOL.2024") {
                startVipSequence();
            } else {
                alert("ERİŞİM REDDEDİLDİ: YETKİSİZ GİRİŞ DENEMESİ!");
            }
        }

        function startVipSequence() {
            document.getElementById('loginSection').style.display = 'none';
            const lineBox = document.getElementById('lineBox');

            // 100 Çizgi Oluşturma
            for (let i = 0; i < 100; i++) {
                let line = document.createElement('div');
                line.className = 'line';
                line.style.top = Math.random() * 100 + '%';
                line.style.animationDelay = (Math.random() * 2) + 's';
                line.style.transition = 'all 5s linear';
                lineBox.appendChild(line);

                // Çizgileri soldan sağa kaydır
                setTimeout(() => {
                    line.style.left = '120%';
                }, 100);
            }

            // 5 Saniye Sonra Yazıya Dönüş
            setTimeout(() => {
                lineBox.style.display = 'none';
                document.getElementById('welcome-text').style.display = 'block';
                // Burada analiz paneline yönlendirme yapabiliriz
            }, 5000);
        }
    </script>
</body>
</html>
