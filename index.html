<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENES DEVA | VIP INTEL</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #0f0; }
        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.2; }
        #vip-layer { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; height: 100%; flex-direction: column; }
        
        .line-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }
        .line { position: absolute; height: 2px; background: linear-gradient(90deg, transparent, #0f0, transparent); width: 250px; left: -300px; opacity: 0; box-shadow: 0 0 15px #0f0; }

        .glass-panel { background: rgba(0, 15, 0, 0.95); border: 2px solid #0f0; padding: 40px; box-shadow: 0 0 40px rgba(0, 255, 0, 0.3); text-align: center; border-radius: 15px; width: 90%; max-width: 600px; }
        #welcome-text { display: none; font-size: 2.8rem; font-weight: bold; text-shadow: 0 0 20px #0f0; letter-spacing: 10px; text-align: center; animation: glitch 0.3s infinite alternate; }
        
        input, textarea { background: #000; border: 1px solid #0f0; color: #0f0; padding: 15px; width: 100%; box-sizing: border-box; margin-bottom: 20px; outline: none; }
        textarea { height: 150px; resize: none; font-size: 0.8rem; }
        button { background: #0f0; color: #000; border: none; padding: 15px 45px; font-weight: bold; cursor: pointer; letter-spacing: 2px; width: 100%; }
        button:hover { box-shadow: 0 0 30px #0f0; transform: scale(1.02); }

        #analysisSection { display: none; }
        .result-item { border-bottom: 1px solid #040; padding: 10px; display: flex; justify-content: space-between; font-size: 1rem; }
        @keyframes glitch { from { transform: skew(1deg); } to { transform: skew(-1deg); } }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="line-container" id="lineBox"></div>

    <div id="vip-layer">
        <div id="loginSection" class="glass-panel">
            <h1>VIP ENTRANCE</h1>
            <input type="password" id="passCode" placeholder="PROTOKOL KODU">
            <button onclick="checkAccess()">SİSTEME SIZ</button>
        </div>

        <h1 id="welcome-text">HOŞGELDİNİZ ENES DEVA</h1>

        <div id="analysisSection" class="glass-panel">
            <h2>INTEL DATA ANALYZER</h2>
            <p style="font-size: 0.7rem; opacity: 0.7;">Profil verilerini veya etkileşim listesini aşağıya yapıştırın.</p>
            <textarea id="rawData" placeholder="Kopyaladığınız verileri buraya yapıştırın (İsimler, kullanıcı adları vb.)"></textarea>
            <button onclick="processRealData()">GERÇEK ANALİZİ BAŞLAT</button>
            <div id="resultArea" style="margin-top: 20px; text-align: left; max-height: 250px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // MATRIX
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/16)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0'; ctx.font = '16px arial';
            drops.forEach((y, i) => {
                ctx.fillText(Math.floor(Math.random()*2), i*16, y*16);
                if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 33);

        // GİRİŞ
        function checkAccess() {
            if(document.getElementById('passCode').value === "ED.DEVA.VİP.PROTOKOL.2024") {
                document.getElementById('loginSection').style.display = 'none';
                const lb = document.getElementById('lineBox');
                for(let i=0; i<100; i++) {
                    let l = document.createElement('div'); l.className = 'line';
                    l.style.top = Math.random()*100+'%'; l.style.opacity = '1';
                    l.style.transition = `left ${2+Math.random()*2}s linear`;
                    lb.appendChild(l);
                    setTimeout(() => l.style.left = '150%', i*15);
                }
                setTimeout(() => {
                    lb.style.display = 'none';
                    document.getElementById('welcome-text').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('welcome-text').style.display = 'none';
                        document.getElementById('analysisSection').style.display = 'block';
                    }, 3000);
                }, 5000);
            } else { alert("YETKİSİZ ERİŞİM!"); }
        }

        // GERÇEK VERİ İŞLEME
        function processRealData() {
            const data = document.getElementById('rawData').value;
            // Metin içindeki tüm kelimeleri süz, sadece anlamlı kullanıcı adı/isim olabilecekleri al
            const names = data.match(/[\w\.\d_]+/g) || [];
            if(names.length < 3) return alert("Veri bulunamadı!");

            const counts = {};
            names.forEach(n => { if(n.length > 2) counts[n] = (counts[n] || 0) + 1; });

            const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 10);
            
            let res = "<h3>TOP 10 GERÇEK ETKİLEŞİM</h3>";
            sorted.forEach(([name, count], i) => {
                res += `<div class="result-item"><span>${i+1}. @${name}</span> <span style="color:#0f0;">${count} PUAN</span></div>`;
            });
            document.getElementById('resultArea').innerHTML = res;
        }
    </script>
</body>
</html>
